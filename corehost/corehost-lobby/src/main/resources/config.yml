# ====================================================== #
#                                                        #
#                 COREHOST LOBBY CONFIG                  #
#                                                        #
# ====================================================== #

# ------------------------------------------------------ #
# Permissions du Lobby :
# - corehost.command.spawn  : Se téléporter au point de spawn
# - corehost.command.friend : Ouvrir le menu d'amis
# - corehost.admin          : Commandes d'administration
# ------------------------------------------------------ #

# Paramètres généraux
settings:
  # Préfixe affiché dans le chat
  prefix: "&8[&6CoreHost&8] &7"
  # Lien d'invitation Discord affiché aux joueurs
  discord-url: "https://discord.gg/aqQM4B7jxH"

# Configuration des rangs (LuckPerms)
luckperms:
  # Groupe attribué par défaut aux nouveaux joueurs
  default-group: "default"

# Configuration BungeeCord
bungeecord:
  # Serveur de repli par défaut
  fallback-server: "lobby"

# Configuration du tableau des scores (Scoreboard)
scoreboard:
  enabled: true
  title: "&6&lCOREHOST"
  ip: "&eplay.corehost.fr"

# Configuration de la barre d'inventaire (Hotbar)
hotbar:
  search_host:
    material: "COMPASS"
    slot: 4
  profile:
    material: "PLAYER_HEAD"
    slot: 8
  visibility_on:
    material: "LIME_DYE"
    slot: 7
  visibility_off:
    material: "GRAY_DYE"
    slot: 7 # Note: visibility_off replace visibility_on on click

# Configuration des Jeux Hébergés (SlimeWorldManager)
games:
  Sumo:
    name: "&e&lCréer un Mini-Jeu (Sumo)"
    material: "SLIME_BALL"
    slot: 11
    max-players: 2
    max-slime-instances: 10
    has-settings-menu: true
    settings-menu-class: "fr.corehost.lobby.gui.SumoSettingsMenu"
    lore:
      - ""
      - "&7Démarrez un serveur Sumo"
      - "&7pour expulser vos adversaires"
      - "&7de l'arène !"
      - ""
      - "&a► Cliquez pour héberger"
  DAC:
    name: "&b&lCréer un Mini-Jeu (DAC)"
    material: "CYAN_WOOL"
    slot: 13
    max-players: 8
    max-slime-instances: 5
    lore:
      - ""
      - "&7Démarrez un serveur Dé à Coudre"
      - "&7et sautez dans le bassin"
      - "&7sans vous écraser !"
      - ""
      - "&a► Cliquez pour héberger"

# Connexion Redis & Base de données
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""

database:
  host: "127.0.0.1"
  port: 3306
  database: "corehost"
  user: "root"
  password: ""
