# ====================================================== #
#                                                        #
#               COREHOST STAFF MOD CONFIG                #
#                                                        #
# ====================================================== #

# ------------------------------------------------------ #
# Permissions StaffMod :
# - staffmod.use         : Permet d'ouvrir le menu de signalement (Click droit triangle)
# - staffmod.mod         : Activer le mode modération (/mod)
# - staffmod.staffchat   : Lire/écrire dans le Staff Chat (/sc)
# - staffmod.vanish.see  : Voir les autres staffs en vanish
# - staffmod.bypasschat  : Ignorer le filtre anti-insultes
# - staffmod.mute        : Utiliser le menu de Mute
# - staffmod.unmute      : Retirer un Mute
# ------------------------------------------------------ #

# Paramètres généraux
settings:
  prefix: "&8[&6Staff&8] &7"

luckperms:
  default-group: "default"

bungeecord:
  fallback-server: "lobby"

# Système de modération automatique du Chat
chat:
  # Mots interdits. S'ils sont détectés, le joueur est auto-mute
  forbidden_words:
    - "fdp"
    - "connard"
    - "salope"
    - "tg"
    - "ntm"
    - "bite"
    - "pute"
    - "enculé"
    - "ez"
  # Durée de l'auto-mute en cas de mot interdit (en minutes)
  auto_mute_duration: 15

# Configuration du menu de sanctions (Mute) - Durées disponibles
mute_durations:
  1:
    name: "5 Minutes"
    duration: 300 # en secondes
    material: "CLOCK"
  2:
    name: "15 Minutes"
    duration: 900
    material: "CLOCK"
  3:
    name: "30 Minutes"
    duration: 1800
    material: "CLOCK"
  4:
    name: "1 Heure"
    duration: 3600
    material: "CLOCK"
  5:
    name: "12 Heures"
    duration: 43200
    material: "CLOCK"
  6:
    name: "1 Jour"
    duration: 86400
    material: "CLOCK"
  7:
    name: "Permanent"
    duration: 0 # 0 = permanent
    material: "CLOCK"

# Configuration du menu de sanctions (Mute) - Raisons
mute_reasons:
  1:
    name: "Spam"
    material: "BOOK"
  2:
    name: "Insultes"
    material: "BOOK"
  3:
    name: "Comportement inadapté"
    material: "BOOK"
  4:
    name: "Publicité"
    material: "BOOK"
  5:
    name: "Provocation"
    material: "BOOK"
  6:
    name: "Menaces"
    material: "BOOK"

# Connexion Redis & Base de données
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
